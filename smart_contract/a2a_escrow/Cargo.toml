[package]
name = "a2a_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

# soroban-env-common pins ethnum = "=1.5.0" exactly. That release constructs
# TryFromIntError via `mem::transmute(())`, assuming it's always a
# zero-sized type - this breaks ("cannot transmute between types of
# different sizes") on some toolchains where that assumption doesn't hold
# (hit on an older/different rustc when deploying, not reproducible on
# every machine). ethnum 1.5.3 dropped the transmute entirely. A normal
# `cargo update` can't reach 1.5.3 past the exact `=1.5.0` pin.
#
# Tried a git patch pointing at upstream's v1.5.3 tag directly - doesn't
# work, because upstream's own Cargo.toml at that tag still declares
# version "1.5.3", which fails the exact `=1.5.0` requirement just like
# the plain registry version does. Only a copy with the version field
# relabeled to "1.5.0" satisfies the pin, and that requires a copy we
# actually control - hence the vendored path below instead of a git
# source. If your build environment doesn't copy this vendor/ directory
# into its build context, patching around this pin isn't possible without
# either fixing that environment's file copying or building the .wasm
# outside of it and deploying the artifact directly.
[patch.crates-io]
ethnum = { path = "vendor/ethnum-1.5.3" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
debug-assertions = false
panic = "abort"
incremental = false
lto = true
codegen-units = 1

[package]
name = "a2a_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

# soroban-env-common pins ethnum = "=1.5.0" exactly. That release constructs
# TryFromIntError via `mem::transmute(())`, assuming it's always a
# zero-sized type - this breaks ("cannot transmute between types of
# different sizes") on some toolchains where that assumption doesn't hold
# (hit on an older/different rustc when deploying, not reproducible on
# every machine). ethnum 1.5.3 dropped the transmute entirely. A normal
# `cargo update` can't reach 1.5.3 past the exact `=1.5.0` pin, so patch it
# to a vendored copy of 1.5.3 instead (kept inside this crate's own
# directory, not a sibling one, so it survives deploy pipelines that only
# copy the a2a_escrow folder rather than all of smart_contract/).
[patch.crates-io]
ethnum = { path = "vendor/ethnum-1.5.3" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
debug-assertions = false
panic = "abort"
incremental = false
lto = true
codegen-units = 1

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Syntax check backend and agents
        run: python -m compileall backend Agents

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

    steps:
      - name: Trigger deployment hooks (safe)
        shell: bash
        run: |
          trigger_hook() {
            local label="$1"
            local url="$2"

            if [ -z "$url" ]; then
              echo "::notice::$label hook not configured; skipping."
              return 0
            fi

            if [[ ! "$url" =~ ^https?:// ]]; then
              echo "::warning::$label hook is not a valid URL; skipping."
              return 0
            fi

            if curl --fail --show-error --silent -X POST "$url" > /dev/null; then
              echo "$label hook triggered."
            else
              echo "::warning::$label hook request failed; continuing without failing CI."
            fi
          }

          trigger_hook "Netlify" "$NETLIFY_BUILD_HOOK"
          trigger_hook "Render" "$RENDER_DEPLOY_HOOK"
